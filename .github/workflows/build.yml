name: Build AmpliPhy Media Bridge .exe
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic requests python-multipart pyinstaller pywebview
    - name: Build executable
      run: python -m PyInstaller --onefile --windowed --name "AmpliPhyBridge" --distpath "." --workpath ".build" metabridge_launcher_v3.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmpliPhyBridge
        path: AmpliPhyBridge.exe
